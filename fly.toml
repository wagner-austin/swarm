app = "corvis-ai"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  USE_DISTRIBUTED_WORKERS = "true"
  LOG_FORMAT = "json"
  LOG_TO_FILE = "0"
  REDIS__ENABLED = "true"
  # Explicitly provide app name for autoscaler backend safety
  FLY_APP_NAME = "corvis-ai"
  DEPLOYMENT_ENV = "production"
  
  # Metrics ports
  METRICS_PORT = "9200"         # Main swarm process
  WORKER_METRICS_PORT = "9100"  # Worker processes
  AUTOSCALER_METRICS_PORT = "9809"  # Autoscaler process

# Required secrets - set these via `fly secrets set`:
# - REDIS__URL: Full Redis URL including password (points to swarm-redis-proxy.internal:6380)
# - CELERY_BROKER_URLS: Same as REDIS__URL (or semicolon‑separated list for failover)
# - DISCORD_TOKEN: Your Discord bot token
# - FLY_API_TOKEN: For deploys and autoscaler backend access

[processes]
  # Main Discord bot
  swarm = "python -m swarm.core"
  # Celery worker for browser automation
  worker = "/usr/local/bin/entrypoint.worker.sh"
  # Autoscaler using Fly.io backend (Flower-free)
  autoscaler = "python -m scripts.celery_autoscaler --orchestrator=fly"

# VM resources per process group
[[vm]]
  memory = "1gb"
  processes = ["worker"]

# Health checks for each process type
[checks.swarm]
  processes = ["swarm"]
  type = "http"
  port = 9200
  path = "/metrics"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[checks.worker]
  processes = ["worker"]
  type = "http"
  port = 9100
  path = "/metrics"  # prometheus_client only provides /metrics endpoint
  interval = "30s"
  timeout = "5s"  
  grace_period = "60s"  # Workers need time to start browser

[checks.autoscaler]
  processes = ["autoscaler"]
  type = "http"
  port = 9809
  path = "/metrics"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[metrics]
  port = 9200
  path = "/metrics"

[experimental]
  auto_rollback = true
