app = "corvis-ai"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  USE_DISTRIBUTED_WORKERS = "true"
  LOG_FORMAT = "json"
  LOG_TO_FILE = "0"
  REDIS__ENABLED = "true"
  
  # Metrics ports
  METRICS_PORT = "9200"         # Main swarm process
  WORKER_METRICS_PORT = "9100"  # Worker processes
  AUTOSCALER_METRICS_PORT = "9809"  # Autoscaler process

# Required secrets - set these via `fly secrets set`:
# - REDIS__URL: Full Redis URL including password (points to swarm-redis-proxy.internal:6380)
# - CELERY_BROKER_URL: Same as REDIS__URL
# - DISCORD_TOKEN: Your Discord bot token
# - FLY_API_TOKEN: For autoscaler to manage Fly machines

[processes]
  # Main Discord bot
  swarm = "python -m swarm.core"
  # Celery worker for browser automation
  worker = "/usr/local/bin/entrypoint.worker.sh"
  # Autoscaler using Fly.io backend (Flower-free)
  autoscaler = "python -m scripts.celery_autoscaler --orchestrator=fly.io --fly-api-token=$FLY_API_TOKEN"

# Health checks for each process type
[checks.swarm]
  processes = ["swarm"]
  type = "http"
  port = 9200
  path = "/metrics"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[checks.worker]
  processes = ["worker"]
  type = "http"
  port = 9100
  path = "/metrics"  # prometheus_client only provides /metrics endpoint
  interval = "30s"
  timeout = "5s"  
  grace_period = "60s"  # Workers need time to start browser

[checks.autoscaler]
  processes = ["autoscaler"]
  type = "http"
  port = 9809
  path = "/metrics"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

# Internal service for metrics/health - no public exposure needed
[[services]]
  processes = ["swarm"]
  internal_port = 9200
  protocol = "tcp"
  
  # No public ports - this is a Discord bot, not a web service
  # Fly internal network allows metrics scraping

[metrics]
  port = 9200
  path = "/metrics"

[experimental]
  auto_rollback = true
