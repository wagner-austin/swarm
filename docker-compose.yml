---
# Docker Compose configuration for Swarm
#
# Profiles:
# - Default (no profile): Core services only (redis, haproxy, swarm, autoscaler)
# - monitoring: Add Flower and Celery-exporter for task monitoring
# - observability: Add full observability stack (Prometheus, Grafana, Loki, Alloy)
# - debug: Add VNC-enabled worker for browser debugging (see docker-compose.override.yml)
#
# Usage examples:
#   docker compose up -d                    # Core services only
#   docker compose --profile monitoring up -d   # Core + monitoring
#   docker compose --profile observability up -d    # Core + full observability
#   docker compose --profile monitoring --profile observability up -d  # Everything
#
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --timeout 0
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # HAProxy provides automatic Redis failover between Upstash and local Redis
  haproxy-redis:
    build:
      context: .
      dockerfile: Dockerfile.haproxy
    container_name: haproxy-redis
    environment:
      # HAProxy reads the real Redis URLs from .env to know which backends to proxy
      # This is the ONLY service that should see the real Redis URLs
      - CELERY_BROKER_URLS=${HAPROXY_REDIS_URLS}
      - HAPROXY_CONFIG_OUTPUT=/config/haproxy-redis-generated.cfg
      # Password will be extracted from URL by entrypoint script
      # Connection limits - prevent socket exhaustion during tests/load
      - MAXCONN=2048  # 8x default, handles CI bursts + production traffic
      - TIMEOUT_CLIENT=30s  # Match Celery's long-poll for result backend
      - TIMEOUT_SERVER=30s
    volumes:
      - ./config:/config
    ports:
      - "6380:6380"  # HAProxy Redis endpoint with automatic failover
      - "8080:8080"  # HAProxy stats dashboard
    depends_on:
      - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["observability"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  # change after first login
      # Keep Grafana output terse; WARN and above matches Loki & swarm
      - GF_LOG_LEVEL=warn  # Reduce from default 'info' to 'warn'
      - GF_LOG_FILTERS=tsdb.loki:warn  # Reduce Loki data source logging
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0   # newer maintenance release
    container_name: loki
    profiles: ["observability"]
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"   # Loki HTTP API
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  alloy:
    # v1.9.2 is the latest GA release (2025-06-27); pin for repeatable builds
    image: grafana/alloy:v1.9.2
    container_name: alloy
    profiles: ["observability"]
    volumes:
      - ./config/alloy-config.river:/etc/alloy/config.river:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    # Allow Alloy's non-root user to access the Docker socket
    group_add:
      - "${DOCKER_GID:-0}"
    command:
      - run
      - /etc/alloy/config.river
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"  # Alloy UI
    depends_on:
      - loki
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - |
          ps aux | grep -v grep | grep '/bin/alloy run' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  swarm:
    image: swarm:latest
    build:
      context: .
      target: runtime-swarm
    container_name: swarm
    env_file:
      - .env
    # Discord frontend (no local workers)
    volumes:
      - .:/app
      # Mount personas directory for custom personas
      - ${USERPROFILE}/.config/swarm/personas:/home/pwuser/.config/swarm/personas:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For DockerApiBackend
    depends_on:
      - redis
      - haproxy-redis
    environment:
      - METRICS_PORT=9200
      - USE_DISTRIBUTED_WORKERS=true
      # --- Logging Configuration ---
      - LOG_FORMAT=json
      - LOG_TO_FILE=false
      # --- Redis Configuration ---
      # All services connect to HAProxy WITH auth on port 6380
      # HAProxy passes connections through to backends (TCP proxy)
      # Settings class expects double underscore for nested config
      - REDIS__ENABLED=true
      - REDIS__URL=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      - CELERY_BROKER_URLS=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
    ports:
      - "9200:9200"      # Prometheus metrics
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
            'http://localhost:9200/metrics', timeout=5
          ).getcode() == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # Flower for Celery monitoring
  flower:
    image: mher/flower:2.0
    container_name: flower
    profiles: ["monitoring"]
    command:
      - celery
      - --broker=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      - flower
      - --port=5555
      - --url_prefix=
      # Disable Celery events in Flower – REST API is sufficient for autoscaler
      - --events=false
      - --inspect-timeout=60
      - --persistent
      - --loglevel=info
      - --broker_api=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
    ports:
      - "5555:5555"
    environment:
      - FLOWER_UNAUTHENTICATED_API=true
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - haproxy-redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5555/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Celery Exporter for Prometheus metrics
  # Provides task-level metrics without the overhead of Flower
  celery-exporter:
    image: danihodovic/celery-exporter:0.10.4
    container_name: celery-exporter
    profiles: ["monitoring"]
    command:
      - --broker-url=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      - --retry-interval=10
      - --log-level=INFO
      - --port=9808
    ports:
      - "9808:9808"
    environment:
      - CE_BROKER_URL=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
    depends_on:
      - haproxy-redis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
            'http://localhost:9808/health'
          ).getcode()==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Worker containers are created dynamically by autoscaler using swarm-worker:latest image
  # Builds the Playwright-enabled worker image automatically with docker compose up --build
  # The service exits immediately, so nothing extra is left running
  worker-image:
    image: swarm-worker:latest
    build:
      context: .
      target: runtime-worker
    # prevent it from "running" for real
    entrypoint: ["true"]  # exits 0 instantly
    restart: "no"
    # scale 0 keeps compose from recreating it after exit
    deploy:
      replicas: 0  # ignored by docker-compose (non-swarm), but documents intent

  # Example: A special worker with custom config/logs and job type
  # TEMPLATE: To add a special worker, copy this block and adjust as needed
  # worker-special:
  #   build: .
  #   container_name: swarm-worker-special
  #   entrypoint: ["/usr/local/bin/entrypoint.worker.sh"]
  #   depends_on:
  #     - redis
  #     - haproxy-redis
  #   environment:
  #     - WORKER_PORT=9110
  #     - DISPLAY=:99
  #     - REDIS_URL=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
  #     - REDIS__URL=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
  #     - REDIS__ENABLED=true
  #     - CELERY_BROKER_URLS=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
  #     - WORKER_ID=worker-special
  #     - JOB_TYPE_PREFIX=tankpit
  #     - LOG_LEVEL=debug
  #   ports:
  #     - "9110:9110"
  #   volumes:
  #     - .:/app
  #     - ./worker-special-config.yaml:/app/config.yaml:ro
  #     - ./worker-special-logs:/app/logs
  #   healthcheck:
  #     test:
  #       - CMD
  #       - python
  #       - -c
  #       - >
  #         import urllib.request,sys;
  #         sys.exit(0 if urllib.request.urlopen(
  #           'http://localhost:9110/metrics', timeout=5
  #         ).getcode() == 200 else 1)
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 60s
  # Place 'restart: unless-stopped' outside the template block when copying

  autoscaler:
    build:
      context: .
      target: runtime-autoscaler
    container_name: autoscaler
    profiles: ["monitoring"]
    env_file:
      - .env
    # Monitors Celery queues via Flower and scales workers
    stop_signal: SIGTERM
    stop_grace_period: 30s
    command:
      - python
      - -m
      - scripts.celery_autoscaler
      - --flower-url=http://flower:5555
      - --orchestrator=docker-api
    environment:
      - FLOWER_URL=http://flower:5555
      - ORCHESTRATOR=docker-api
      - CHECK_INTERVAL=30
      - PYTHONPATH=/app
      - COMPOSE_PROJECT_NAME=swarm
      - WORKER_METRICS_PORT=9100
      # --- Redis Configuration ---
      # All services connect to HAProxy WITH auth on port 6380
      # HAProxy passes connections through to backends (TCP proxy)
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      - CELERY_BROKER_URLS=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/app
    depends_on:
      - flower
      - redis
      - haproxy-redis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  redis-data:
  grafana-data:
  prometheus-data:
  loki-data:
