---
# docker-compose.test.yml
# ==================
# Test-specific overrides that use only local Redis (no Upstash)
# This prevents rate limit issues and authentication problems in tests
#
# IMPORTANT: This file is for CI/testing ONLY!
# - Normal development: `make start` uses docker-compose.yml (with Upstash failover)
# - CI testing: Use `-f docker-compose.yml -f docker-compose.test.yml` explicitly
#
# This file overrides Redis URLs to bypass HAProxy and use local Redis directly:
# - Avoids Upstash rate limits during tests
# - Ensures consistent test environment
# - SHOULD NOT be used for normal development (causes config mismatch)

services:
  haproxy-redis:
    environment:
      # Override to use only local Redis - no Upstash
      # Same URL repeated so HAProxy has primary/backup but both point to local
      # Include password since local Redis requires authentication
      HAPROXY_REDIS_URLS: >-
        redis://default:${REDIS_PASSWORD}@redis:6379/0;redis://default:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URLS: >-
        redis://default:${REDIS_PASSWORD}@redis:6379/0;redis://default:${REDIS_PASSWORD}@redis:6379/0
      HAPROXY_CONFIG_OUTPUT: /config/haproxy-redis-generated.cfg

  autoscaler:
    env_file: []
    volumes: []
    environment:
      # Keep using HAProxy like production, but it points to local Redis only
      REDIS_URL: redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      REDIS__URL: redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      CELERY_BROKER_URLS: >-
        redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0

  swarm:
    env_file: []
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      # Keep using HAProxy like production for consistency
      REDIS_URL: redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      REDIS__URL: redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      CELERY_BROKER_URLS: >-
        redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0

  # Flower removed in test stack
