---
# Local debug overrides - NOT for production
# Activates VNC-enabled worker for watching browser operation
# Usage: docker compose --profile debug up -d

services:
  # Debug worker with VNC for watching browser operation
  debug-worker:
    image: swarm-worker-vnc:latest
    build:
      context: .
      target: runtime-worker-vnc
    container_name: swarm-debug-worker
    profiles: ["debug"]
    environment:
      - ENABLE_VNC=1
      - PLAYWRIGHT_HEADLESS=0
      - WORKER_METRICS_PORT=9110
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      - REDIS__URL=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      - REDIS__ENABLED=true
      - CELERY_BROKER_URLS=redis://default:${REDIS_PASSWORD}@haproxy-redis:6380/0
      - WORKER_ID=debug-worker
      - LOG_LEVEL=debug
    ports:
      - "6080:6080"  # noVNC web interface
      - "5900:5900"  # Raw VNC port
      - "9110:9110"  # Metrics
    volumes:
      - .:/app
    depends_on:
      - redis
      - haproxy-redis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
            'http://localhost:9110/metrics', timeout=5
          ).getcode() == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
