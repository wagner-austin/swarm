# pytest.ini - Pytest configuration for the swarm AI task execution system.
[pytest]
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:.*audioop.*is deprecated.*:DeprecationWarning
    ignore:.*tagMap is deprecated.*:DeprecationWarning:pyasn1\.codec\.ber\.encoder
    ignore:.*typeMap is deprecated.*:DeprecationWarning:pyasn1\.codec\.ber\.encoder
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
markers = 
    asyncio: mark test as async
    unit: fast unit tests with mocks/fakes
    integration: tests requiring external services (Redis, Docker)
    docker: tests requiring Docker containers running
    slow: tests that take > 5 seconds
    redis: tests requiring real Redis connection
    timeout: mark test with a timeout in seconds
addopts = --randomly-seed=last --log-disable=asyncio --ignore=scripts/

# Environment variables
env =
    SWARM_TEST_MODE=1
    SWARM_PERSONA_DIR=1
    # Redis routing alignment for integration tests:
    # - Route producer (pytest process) through HAProxy on localhost:6380 DB 0 to MATCH workers.
    #   This ensures the BrowserSessionRouter and SessionRegistry see the same keys (heartbeats/affinity)
    #   that workers write, preventing session-affinity drift and timeouts.
    # - Tests that require destructive operations (flushdb) patch Settings to use direct Redis DB 15
    #   on localhost:6379 within their own fixtures (see tests/integration/test_worker_heartbeat_redis.py).
    #   Do NOT change the defaults here to DB 15, or router/registry will misroute.
    # REDIS_PASSWORD is read from environment (.env file via python-dotenv)
    # Tests will use whatever password is configured in your .env file
    # CI generates a random password at runtime (see .github/workflows/ci.yml)

# End of pytest.ini
