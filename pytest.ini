# pytest.ini - Pytest configuration for the swarm AI task execution system.
[pytest]
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:.*audioop.*is deprecated.*:DeprecationWarning
    ignore:.*tagMap is deprecated.*:DeprecationWarning:pyasn1\.codec\.ber\.encoder
    ignore:.*typeMap is deprecated.*:DeprecationWarning:pyasn1\.codec\.ber\.encoder
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
markers = 
    asyncio: mark test as async
    unit: fast unit tests with mocks/fakes
    integration: tests requiring external services (Redis, Docker)
    docker: tests requiring Docker containers running
    slow: tests that take > 5 seconds
    redis: tests requiring real Redis connection
    timeout: mark test with a timeout in seconds
addopts = --randomly-seed=last --log-disable=asyncio --ignore=scripts/debug/

# Environment variables
env =
    SWARM_TEST_MODE=1
    SWARM_PERSONA_DIR=1
    # Tests MUST use a separate Redis DB index to avoid wiping production data.
    # Production app traffic goes through HAProxy on 6380 (db 0), proxied to the Redis container (6379).
    # Tests that perform destructive ops (flushdb) must target a different DB index (e.g., 15) on 6379.
    # Celery broker can remain via HAProxy on db 0; workers are not affected by test flushes on db 15.
    REDIS__URL=redis://default:AT_MAAIncDIyM2ViYjNlNTAyN2Y0YWYzOGZiZWI5ZDZiZDQyNGM0Y3AyMTYzMzI@localhost:6379/15
    REDIS_URL=redis://default:AT_MAAIncDIyM2ViYjNlNTAyN2Y0YWYzOGZiZWI5ZDZiZDQyNGM0Y3AyMTYzMzI@localhost:6379/15
    CELERY_BROKER_URLS=redis://default:AT_MAAIncDIyM2ViYjNlNTAyN2Y0YWYzOGZiZWI5ZDZiZDQyNGM0Y3AyMTYzMzI@localhost:6380/0

# End of pytest.ini
