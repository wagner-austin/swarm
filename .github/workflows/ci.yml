---
name: CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-3.12-

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run ruff check
        run: poetry run ruff check .

      - name: Run ruff format check
        run: poetry run ruff format --check .

      - name: Enforce no casts/ignores in app code
        run: |
          set -e
          # Disallow typing.cast usages in app code (fixed-string match to avoid regex issues)
          if grep -RIn -F "cast(" swarm | grep -v "^$"; then
            echo "Forbidden typing.cast found in app code" >&2; exit 1; fi
          # Disallow `# type: ignore` in app code
          if grep -RIn -F "# type: ignore" swarm | grep -v "^$"; then
            echo "Forbidden type: ignore found in app code" >&2; exit 1; fi

      - name: Run mypy
        run: poetry run mypy --strict

      - name: Check YAML files
        run: poetry run yamllint -c .yamllint .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ matrix.python-version }}-

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --with dev

      - name: Install dependencies (cache hit)
        if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
        run: poetry install --with dev --no-root

      - name: Generate CI Redis password (unit tests)
        run: |
          echo "REDIS_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV

      - name: Create minimal .env for unit tests
        run: |
          printf "REDIS_PASSWORD=%s\n" "$REDIS_PASSWORD" > .env
          printf "REDIS__ENABLED=true\n" >> .env
          printf "REDIS__URL=redis://default:%s@localhost:6380/0\n" "$REDIS_PASSWORD" >> .env
          printf "REDIS_URL=redis://default:%s@localhost:6380/0\n" "$REDIS_PASSWORD" >> .env
          printf "CELERY_BROKER_URLS=redis://default:%s@localhost:6380/0\n" "$REDIS_PASSWORD" >> .env

      - name: Run unit tests (no Docker/Redis required)
        run: poetry run pytest tests/ -v --cov=swarm --cov-report=term-missing -m "not integration"

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Generate CI Redis password
        run: |
          echo "REDIS_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV

      - name: Create minimal .env for Compose
        run: |
          printf "REDIS_PASSWORD=%s\n" "$REDIS_PASSWORD" > .env
          printf "REDIS__ENABLED=true\n" >> .env
          printf "REDIS__URL=redis://default:%s@haproxy-redis:6380/0\n" "$REDIS_PASSWORD" >> .env
          printf "REDIS_URL=redis://default:%s@haproxy-redis:6380/0\n" "$REDIS_PASSWORD" >> .env
          printf "CELERY_BROKER_URLS=redis://default:%s@haproxy-redis:6380/0\n" "$REDIS_PASSWORD" >> .env
          HP_URL="redis://default:${REDIS_PASSWORD}@redis:6379/0"
          printf "HAPROXY_REDIS_URLS=%s;%s\n" "$HP_URL" "$HP_URL" >> .env
          printf "USERPROFILE=%s\n" "$HOME" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose config
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      - name: Build test images
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml build

      - name: Start test stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d redis haproxy-redis
          echo "Waiting for services to be healthy..."
          timeout 60 sh -c 'until docker compose -f docker-compose.yml -f docker-compose.test.yml ps | grep -q "haproxy-redis.*healthy"; do sleep 2; done' || {
            echo "HAProxy failed to become healthy, showing logs:"
            docker compose -f docker-compose.yml -f docker-compose.test.yml logs haproxy-redis
            exit 1
          }

      - name: Run integration tests with pytest (host)
        run: |
          poetry install --with dev
          poetry run pytest tests/ -v -m "integration"

      - name: Run Celery integration tests (in container)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm \
            --entrypoint "" \
            -e REDIS_PASSWORD=${REDIS_PASSWORD} \
            swarm python /app/scripts/test_celery_integration.py

      - name: Check monitoring health (in container)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm \
            --entrypoint "" \
            swarm python /app/scripts/check_monitoring.py || echo "Monitoring not critical for CI"

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate fly.toml
        run: flyctl doctor --config fly.toml --json || true

      - name: Build Docker image
        run: docker build --target runtime-swarm -t swarm:ci .
